<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffc00">
<title>تواصل معي</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(145deg, #fffde7, #fff); color: #171717;
  }
  main {
    width: min(100%, 390px); text-align: center; padding: 32px 24px;
    border: 1px solid #eee; border-radius: 28px; background: #fff;
    box-shadow: 0 16px 45px #00000012;
  }
  .ghost { width: 72px; height: 72px; display: grid; place-items: center;
    margin: 0 auto 16px; border-radius: 22px; background: #fffc00; font-size: 38px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 0 0 26px; color: #666; }
  a {
    display: block; text-decoration: none; border-radius: 15px;
    padding: 15px 18px; margin-top: 12px; font-weight: 700;
    transition: transform .15s ease;
  }
  a:hover { transform: translateY(-2px); }
  .wa { background: #25d366; color: #fff; }
  .snap { background: #fffc00; color: #111; border: 1px solid #eee; }
  small { display: block; margin-top: 24px; color: #888; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="ghost" aria-hidden="true">👻</div>
  <h1>تواصل معي</h1>
  <p>اختر المنصة التي تفضّلها</p>
  <a class="wa" href="https://wa.me/213782870204" target="_blank" rel="noopener noreferrer">WhatsApp</a>
  <a class="snap" href="https://www.snapchat.com/add/ab17lou" target="_blank" rel="noopener noreferrer">Snapchat · ab17lou</a>

</main>
</body>
</html>
